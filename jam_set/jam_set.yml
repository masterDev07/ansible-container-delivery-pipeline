---
- name: Automated Daily Time Synchronization Playbook
  hosts: localhost         # CHANGED: Target is local Mint laptop, not tigas
  connection: local        # Run directly on desktop machine
  gather_facts: false
  become: true             # Required to change system hardware clock/time

  vars:
    # Defining target paths based on true environment
    python_executable: "/media/mint/dataku1/backup/kodeku/phphai/python/venv/bin/python3"
    script_path: "/media/mint/dataku1/settingan/cctv_alarm/bangunan/skripBerguna/set_jam.py"

    # Using ephemeral RAM-based path so it auto-resets tomorrow when laptop reboots
    flag_file_path: "/run/time_setup_daily_success.flag"

    # Network IP of Android Termux host
    android_ip: "192.168.43.1"

  tasks:
    # STEP 1: Check if the system has already synchronized the clock today
    - name: Verify if daily time setup flag file exists
      ansible.builtin.stat:
        path: "{{ flag_file_path }}"
      register: flag_check_result

    # STEP 2: Patiently wait until laptop connects to Android hotspot
    - name: Wait for Android Termux host to become reachable on network
      ansible.builtin.command:
        cmd: "ping -c 1 -W 2 {{ android_ip }}"
      register: ping_output
      # Retry 30 times with 10 seconds delay (Total tolerance: 5 minutes waiting time)
      retries: 30
      delay: 10
      until: ping_output.rc == 0
      when: not flag_check_result.stat.exists
      changed_when: false

    # STEP 3: Execute time synchronization script using the venv python
    - name: Execute local python script to update laptop system clock
      ansible.builtin.command:
        cmd: "{{ python_executable }} {{ script_path }}"
      register: script_execution_result
      when:
        - not flag_check_result.stat.exists
        - ping_output.rc == 0

    # STEP 4: Create the daily flag inside RAM to prevent re-execution until next boot
    - name: Touch daily flag file to mark synchronization as complete
      ansible.builtin.file:
        path: "{{ flag_file_path }}"
        state: touch
        mode: '0644'
      when:
        - not flag_check_result.stat.exists
        - script_execution_result.rc == 0
