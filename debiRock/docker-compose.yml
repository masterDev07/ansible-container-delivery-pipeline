services:
  # ==========================================
  # 5 SERVER DEBIAN (Node 1 - 5)
  # ==========================================
  debian1:
    image: debian:12-slim
    container_name: deb-node-01
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    networks:
      ansible_net:
        ipv4_address: 172.28.0.11
    volumes:
      - ./apt_cache_data:/var/cache/apt-cacher-ng

